name: test
on:
  push:
  pull_request:
jobs:
  offline-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install numpy pandas matplotlib pytest
      - run: python -m pytest -q
      - run: python run_signal_demo.py --output-dir ci-results --seed 42
